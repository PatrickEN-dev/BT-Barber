version: 2

updates:
  # npm dependencies — grouped to avoid PR spam, monthly cadence.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # All non-major bumps land in a single PR per group, weekly review-friendly.
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - minor
          - patch
      stripe:
        patterns:
          - "stripe"
          - "@stripe/*"
        update-types:
          - minor
          - patch
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
        update-types:
          - minor
          - patch
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      lint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "tailwindcss"
          - "typescript"
        update-types:
          - minor
          - patch
    # Major bumps come as individual PRs so we can review carefully.
    ignore:
      # Pin majors that we explicitly chose to delay (Next 16, Tailwind 4, etc).
      # Remove from this list when ready to upgrade.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  # Github Actions itself — small surface, monthly is plenty.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
